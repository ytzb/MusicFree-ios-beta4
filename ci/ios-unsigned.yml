name: iOS 未签名 ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: bash scripts/ci-build-ios.sh
      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: MusicFree-ios-unsigned
          path: out-ipa/*.ipa
          retention-days: 30
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
